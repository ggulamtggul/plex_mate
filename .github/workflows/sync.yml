name: Sync Upstream

on:
  schedule:
    # 매일 UTC 00:00 (한국시간 오전 09:00)에 자동 실행
    - cron: '0 0 * * *'
  # GitHub 웹에서 수동으로 즉시 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/flaskfarm/plex_mate.git
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --no-edit -m "chore(sync): merge upstream flaskfarm/plex_mate changes" || {
            echo "::error::Merge conflict detected! Please resolve conflicts manually."
            exit 1
          }

      - name: Push changes
        run: |
          git push origin main
