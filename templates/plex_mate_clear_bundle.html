{% extends "base.html" %}
{% block content %}
<script src="{{ url_for('.static', filename='base.js') }}"></script>

<div class='row' style="padding-top: 5px; padding-bottom:5px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>번들 선택</strong>
  </div>
  <div class="input-group col-sm-2">
    <select id="local_type" name="local_type" class="form-control form-control-sm">
      <option value="Metadata" selected>Metadata</option>
      <option value="Media">Media</option>
    </select>
  </div>
  <div class="input-group col-sm-2">
    <select id="meta_type" name="meta_type" class="form-control form-control-sm">
      <option value="Movies" selected>Movie</option>
      <option value="TV Shows">TV Shows</option>
    </select>
  </div>
  <div class="input-group col-sm-1">
    <select id="prefix" name="prefix" class="form-control form-control-sm">
      <option value="all" selected>전체</option>
      <option value="0" selected>0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="a">a</option>
      <option value="b">b</option>
      <option value="c">c</option>
      <option value="d">d</option>
      <option value="e">e</option>
      <option value="f">f</option>
    </select>
  </div>

  <div class='col-sm-1 set-left'>
    <strong>DryRun</strong>
  </div>
  <div class="input-group col-sm-1">
    <input id="dryrun" name="dryrun" class="form-control form-control-sm" type="checkbox" data-toggle="toggle" checked>
  </div>
  <div class="input-group col-sm-4" style="padding-left:0px; padding-top:5px">
    <div class="btn-group btn-group-sm flex-wrap mr-2" role="group" style="padding-left:5px; padding-top:0px">
      <button id="bundle_stop_btn" class="btn btn-sm btn-outline-danger">중지</button>
      <button id="bundle_start_all_btn" class="btn btn-sm btn-outline-success">1~3단계 순차 실행</button>
      <button id="bundle_start_btn" class="btn btn-sm btn-outline-info">1단계</button>
      <button id="bundle_start2_btn" class="btn btn-sm btn-outline-info">2단계</button>
      <button id="bundle_start3_btn" class="btn btn-sm btn-outline-info">3단계</button>
    </div>
  </div>
</div>

<div class='row' style="padding-top: 5px; padding-bottom:0px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>상태</strong>
  </div>
  <div id='status_div' class="col-sm-11">
    대기중
  </div>
</div>

{{ macros.m_hr_head_top() }}
{{ macros.m_row_start('0') }}
{{ macros.m_col(12,  macros.m_strong('Log')) }}
{{ macros.m_row_end() }}
{{ macros.m_hr_head_bottom() }}
<div id="list_div"></div>

<script type="text/javascript">

$(document).ready(function(){
  socket_init();
});


$("body").on('change', '#local_type', function(e){
  e.preventDefault();
  value = $(this).val();
  if (value == 'Metadata') {
    $("#meta_type").attr("disabled", false);
  } else {
    $("#meta_type").attr("disabled", true);
  }
});


function get_bundle_target_name() {
  var l = $('#local_type').val();
  var m = l === 'Metadata' ? ` (${$('#meta_type').val()})` : '';
  var p = $('#prefix').val() === 'all' ? '전체' : $('#prefix').val();
  return `${l}${m} [${p}]`;
}

var seq_state = {
  active: false,
  step_idx: 0,
  steps: ['step1', 'step2', 'step3'],
  step_names: {'step1': '1단계', 'step2': '2단계', 'step3': '3단계'},
  section_name: '',
  has_started_run: false,
  last_work: null // { section_name, step_name, time, remove_count, remove_size }
};

function safe_notify(msg, type) {
  try {
    if (typeof $.notify === 'function') {
      $.notify({message: msg}, {type: type || 'info'});
    } else if (typeof notify === 'function') {
      notify(msg, type);
    }
  } catch(e) {
    console.log('[Notify]', msg);
  }
}

function run_seq_step(step_idx) {
  seq_state.step_idx = step_idx;
  seq_state.has_started_run = false;
  var step_cmd = seq_state.steps[step_idx];
  var step_title = seq_state.step_names[step_cmd];
  safe_notify(`[${seq_state.section_name}] ${step_title} 자동 시작`, 'info');
  globalSendCommandPage('start', $('#local_type').val()+'_'+$('#meta_type').val()+'_'+ $('#prefix').val(), $('#dryrun').is(":checked"), step_cmd);
}

$("body").on('click', '#bundle_start_all_btn', function(e){
  e.preventDefault();
  var sec_name = get_bundle_target_name();
  seq_state.active = true;
  seq_state.section_name = sec_name;
  safe_notify(`<strong>[${sec_name}] 1~3단계 순차 실행</strong>을 시작합니다.`, 'success');
  run_seq_step(0);
});

$("body").on('click', '#bundle_stop_btn', function(e){
  e.preventDefault();
  seq_state.active = false;
  safe_notify('사용자에 의해 작업이 중지되었습니다.', 'warning');
  globalSendCommandPage('stop');
});


$("body").on('click', '#bundle_start_btn', function(e){
  e.preventDefault();
  seq_state.active = false;
  seq_state.section_name = get_bundle_target_name();
  globalSendCommandPage('start', $('#local_type').val()+'_'+$('#meta_type').val()+'_'+ $('#prefix').val(), $('#dryrun').is(":checked"), "step1");
});

$("body").on('click', '#bundle_start2_btn', function(e){
  e.preventDefault();
  seq_state.active = false;
  seq_state.section_name = get_bundle_target_name();
  globalSendCommandPage('start', $('#local_type').val()+'_'+$('#meta_type').val()+'_'+ $('#prefix').val(), $('#dryrun').is(":checked"), "step2");
});

$("body").on('click', '#bundle_start3_btn', function(e){
  e.preventDefault();
  seq_state.active = false;
  seq_state.section_name = get_bundle_target_name();
  globalSendCommandPage('start', $('#local_type').val()+'_'+$('#meta_type').val()+'_'+ $('#prefix').val(), $('#dryrun').is(":checked"), "step3");
});

function make_one(data) {
  row = j_row_start_hover();
  row += make_log("bundle", data.folder + ' / ' + data.bundle);
  if (data.title != null) {
    row += make_log("제목", data.title);
    row += make_log("메타타입", data.metadata_type);
  } else if (data.file != null) {
    row += make_log("파일", data.file);
  } else {
    row += make_log("삭제", color(humanFileSize(data.remove)));
  } 
  row += j_row_end();
  return row;
}


function make_status(data) {
  str = '';
  if (data.is_working == 'run') {
    tmp = '실행중';
    if (seq_state.active) {
      seq_state.has_started_run = true;
      var cur_cmd = seq_state.steps[seq_state.step_idx];
      var cur_name = seq_state.step_names[cur_cmd];
      tmp = `[순차실행 ${seq_state.step_idx + 1}/3단계: ${cur_name}] ` + tmp;
    }
  } else if (data.is_working == 'wait') {
    tmp = '대기중';
  } else if (data.is_working == 'stop') {
    tmp = '사용자 중지';
    seq_state.active = false;
  }

  if (data.count != null) tmp += '(' + data.current + '/' + data.count + ') ';
  
  str += '<h4>' + tmp;
  if (data.remove_size != null && data.remove_size != 0) {
    str += ' / 삭제 번들 수  : ' + color(data.remove_count);
    str += ' / 삭제크기 : ' + color(humanFileSize(data.remove_size));
  }

  // 직전 작업 정보 표시 (대기 중일 때 항상 표기)
  if (data.is_working == 'wait' && seq_state.last_work != null) {
    var count_info = seq_state.last_work.remove_count != null ? ` / 삭제 번들: ${color(seq_state.last_work.remove_count)}개` : '';
    str += ` <span style="font-size:13px; font-weight:normal; margin-left:12px; color:#28a745; background:rgba(40,167,69,0.15); padding:3px 8px; border-radius:4px; border:1px solid rgba(40,167,69,0.3);">` +
           `<i class="fa fa-check-circle"></i> 직전 완료: <strong>[${seq_state.last_work.section_name}] ${seq_state.last_work.step_name}</strong> (${seq_state.last_work.time})` +
           `${count_info} / 삭제: ${color(humanFileSize(seq_state.last_work.remove_size))}` +
           `</span>`;
  }
  str += '</h4>';
  $('#status_div').html(str);

  // 순차 실행 상태 머신: 실제로 run을 거친 후 wait가 되었을 때만 다음 단계로 이동!
  if (seq_state.active && seq_state.has_started_run && data.is_working == 'wait') {
    var finished_cmd = seq_state.steps[seq_state.step_idx];
    var finished_name = seq_state.step_names[finished_cmd];
    var now_time = new Date().toLocaleTimeString();

    // 직전 작업 기록 저장
    seq_state.last_work = {
      section_name: seq_state.section_name || get_bundle_target_name(),
      step_name: finished_name,
      time: now_time,
      remove_count: data.remove_count || 0,
      remove_size: data.remove_size || 0
    };

    seq_state.has_started_run = false; // 플래그 초기화

    // 다음 단계 확인
    var next_idx = seq_state.step_idx + 1;
    if (next_idx < seq_state.steps.length) {
      var next_cmd = seq_state.steps[next_idx];
      var next_name = seq_state.step_names[next_cmd];
      safe_notify(`${finished_name} 완료! 2초 후 <strong>${next_name}</strong>을 시작합니다.`, 'info');

      // UI에 다음 단계 카운트다운 표시
      $('#status_div').append(`<div id="seq_countdown_div" style="color:#17a2b8; font-size:14px; margin-top:4px;">⏳ ${finished_name} 완료 → <strong>${next_name}</strong> 자동 시작 대기 중 (2초)...</div>`);

      setTimeout(function() {
        if (seq_state.active) {
          run_seq_step(next_idx);
        }
      }, 2000);
    } else {
      seq_state.active = false;
      safe_notify(`🎉 <strong>[${seq_state.section_name}] 1~3단계 전체 순차 실행이 완료되었습니다!</strong>`, 'success');
      $('#seq_countdown_div')?.remove();
    }
  } else if (!seq_state.active && data.is_working == 'wait' && seq_state.section_name) {
    // 단일 수동 단계 실행 후 완료 시에도 직전 작업 기록 업데이트
    var now_time = new Date().toLocaleTimeString();
    if (!seq_state.last_work || seq_state.last_work.time !== now_time) {
      seq_state.last_work = {
        section_name: seq_state.section_name,
        step_name: '단일 작업',
        time: now_time,
        remove_count: data.remove_count || 0,
        remove_size: data.remove_size || 0
      };
    }
  }
}




















</script> 

{% endblock %}
